    :root { --orange:#f47920; --peach:#f7b083; --salmon:#f79b6d; --ink:#111; --line:#e7e2dc; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { background:#fff; color:var(--ink); font-family:"Hanwha","Noto Sans KR",Arial,sans-serif; overflow:hidden; }
    .stage { position:fixed; inset:0; overflow:hidden; background:#fff; isolation:isolate; }
    .stage::before { content:""; position:absolute; width:min(70vmin,720px); height:min(70vmin,720px); left:50%; top:56%; transform:translate(-50%,-50%); background:radial-gradient(circle,rgba(242,100,34,.1),transparent 67%); opacity:0; animation:glow 2.8s ease forwards; }
    .grid { position:absolute; inset:0; opacity:.035; background-image:linear-gradient(rgba(30,30,30,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(30,30,30,.6) 1px,transparent 1px); background-size:64px 64px; mask-image:linear-gradient(to bottom,#000,transparent 85%); }
    .copy { position:absolute; z-index:4; left:0; right:0; top:clamp(40px,8vh,96px); padding:0 6vw; text-align:center; }
    .kicker { margin:0 0 18px; color:var(--orange); font-size:11px; letter-spacing:.16em; font-weight:700; }
    h1 { margin:0 auto; max-width:900px; font-size:clamp(34px,4.6vw,64px); line-height:1.16; letter-spacing:-.04em; font-weight:700; word-break:keep-all; }
    .lede { margin:20px auto 0; max-width:640px; word-break:keep-all; color:#66615d; font-weight:300; font-size:clamp(15px,1.3vw,19px); line-height:1.75; }
    .piece { position:absolute; z-index:1; width:180px; height:164px; left:50%; top:56%; transform:translate(-50%,-50%) scale(var(--s,1.25)); }
    .dot { position:absolute; top:76px; left:84px; width:13px; height:13px; border-radius:50%; background:var(--orange); opacity:0; }
    .a { animation:dotA 2.8s cubic-bezier(.24,.78,.18,1) forwards; }
    .b { background:var(--peach); animation:dotB 2.8s .11s cubic-bezier(.24,.78,.18,1) forwards; }
    .c { background:var(--salmon); animation:dotC 2.8s .22s cubic-bezier(.24,.78,.18,1) forwards; }
    .logo { position:absolute; inset:0; margin:auto; width:154px; height:140px; opacity:0; transform:scale(.55); transform-origin:50% 50%; animation:logo 2.8s .3s cubic-bezier(.3,.75,.2,1) forwards; }
    .wordmark { position:absolute; z-index:3; left:50%; top:calc(56% + 130px); transform:translateX(-50%) translateY(10px); opacity:0; margin:0; color:#111; font-size:clamp(34px,4.4vw,56px); font-weight:400; letter-spacing:-.04em; line-height:1; animation:word 2.8s cubic-bezier(.3,.75,.2,1) forwards; }
    .ctrl { position:absolute; z-index:5; bottom:28px; left:0; right:0; display:flex; justify-content:center; gap:28px; }
    .replay, .skip { border:0; padding:6px 0; background:transparent; cursor:pointer; font-size:13px; color:#77716b; font-weight:700; }
    .replay { color:#111; border-bottom:1px solid #a8a19a; }
    .replay:focus-visible, .skip:focus-visible { outline:3px solid #f7b083; outline-offset:3px; }
    @keyframes dotA { 0%{opacity:0;transform:translate(-80px,35px) scale(.4)} 18%{opacity:1;transform:translate(-34px,0) scale(1)} 52%{opacity:1;transform:translate(-4px,-2px) scale(1.3)} 66%,100%{opacity:0;transform:translate(0,0) scale(2.6)} }
    @keyframes dotB { 0%{opacity:0;transform:translate(70px,50px) scale(.4)} 20%{opacity:1;transform:translate(0) scale(1)} 54%{opacity:1;transform:translate(4px,2px) scale(1.3)} 68%,100%{opacity:0;transform:translate(0,0) scale(2.6)} }
    @keyframes dotC { 0%{opacity:0;transform:translate(5px,-84px) scale(.4)} 22%{opacity:1;transform:translate(34px,0) scale(1)} 56%{opacity:1;transform:translate(0,-4px) scale(1.3)} 70%,100%{opacity:0;transform:translate(0,0) scale(2.6)} }
    @keyframes logo { 0%,50%{opacity:0;transform:scale(.55)} 62%{opacity:.35;transform:scale(.92)} 82%,100%{opacity:1;transform:scale(1)} }
    @keyframes word { 0%,76%{opacity:0;transform:translateX(-50%) translateY(10px)} 90%,100%{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes glow { 0%,36%{opacity:0;transform:translate(-50%,-50%) scale(.6)} 65%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)} }
    .is-skipped .dot { animation:none; opacity:0; }
    .is-skipped .logo { animation:none; opacity:1; transform:none; }
    .is-skipped .wordmark { animation:none; opacity:1; transform:translateX(-50%); }
    .is-skipped::before { animation:none; opacity:1; transform:translate(-50%,-50%); }
    @media (max-width:640px) { .copy{top:36px} h1{font-size:32px} .lede br{display:none} .piece{--s:.95} .wordmark{top:calc(56% + 100px);font-size:32px} }
    @media (max-height:640px) { .piece{--s:.95} .wordmark{top:calc(56% + 100px)} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important}.dot{opacity:0}.logo{opacity:1;transform:none}.wordmark{opacity:1;transform:translateX(-50%)} }
  </style>
